worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api { server backend:8000; }
  upstream frontend { server web:80; }
  server {
    listen 80;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /api/auth/login {
      limit_req zone=login burst=12 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
      limit_req zone=general burst=50 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 180s;
    }
    location /docs { proxy_pass http://api; }
    location /openapi.json { proxy_pass http://api; }
    location /metrics { return 404; }
    location / { proxy_pass http://frontend; }
  }
}
