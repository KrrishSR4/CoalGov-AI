name: Validate CoalGov
on: [push, pull_request]
jobs:
  api-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
  api-postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5
        env: {POSTGRES_USER: coalgov, POSTGRES_PASSWORD: test-only-ci-password, POSTGRES_DB: coalgov_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U coalgov -d coalgov_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://coalgov:test-only-ci-password@localhost:5432/coalgov_test
      COALGOV_TEST_DATABASE_URL: postgresql+psycopg2://coalgov:test-only-ci-password@localhost:5432/coalgov_test
      SEED_DEMO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: python -m app.migrate
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: '**/package-lock.json'}
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci && npm run typecheck && npx expo export --platform android --max-workers 2
        working-directory: mobile
